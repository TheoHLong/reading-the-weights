experiment_name: resnet18_cifar10_debug
seed: 42
output_dir: results/metrics
checkpoint_dir: checkpoints

dataset:
  name: cifar10
  root: data/raw
  image_size: 32
  channels: 3
  num_classes: 10

guide:
  architecture: cifar_resnet18

train:
  epochs: 2
  batch_size: 64
  lr: 0.1
  momentum: 0.9
  wd: 0.0005
  num_workers: 0
  pin_memory: false
  device: auto
  val_fraction: 0.1
  max_train_batches: 2
  max_eval_batches: 1
