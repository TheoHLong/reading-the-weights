experiment_name: cifar10_cka_debug
seed: 42
output_dir: results/metrics
checkpoint_dir: checkpoints

dataset:
  name: cifar10
  root: data/raw
  image_size: 32
  channels: 3
  num_classes: 10

model:
  d_input: 3072
  d_hidden: 512
  n_layer: 1
  d_output: 10
  bias: false
  residual: false

train:
  epochs: 2
  batch_size: 64
  lr: 0.001
  wd: 0.01
  num_workers: 0
  pin_memory: false
  device: auto
  val_fraction: 0.1
  max_train_batches: 2
  max_eval_batches: 1

transfer:
  method: cka
  teacher_checkpoint: checkpoints/resnet18_cifar10_teacher.pt
  alpha: 3.0
  reduction: mean
  teacher_layers: [layer2, layer4]
  student_layers: [embed, blocks.0]
  layer_map:
    layer2: embed
    layer4: blocks.0
