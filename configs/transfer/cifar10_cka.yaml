experiment_name: cifar10_cka
seed: 42
output_dir: results/metrics
checkpoint_dir: checkpoints

dataset:
  name: cifar10
  root: data/raw
  image_size: 32
  channels: 3
  num_classes: 10

model:
  d_input: 3072
  d_hidden: 512
  n_layer: 1
  d_output: 10
  bias: false
  residual: false

train:
  epochs: 50
  batch_size: 256
  lr: 0.001
  wd: 0.01
  num_workers: 2
  pin_memory: true
  device: auto
  val_fraction: 0.1

transfer:
  method: cka
  teacher_checkpoint: checkpoints/resnet18_cifar10_teacher.pt
  alpha: 3.0
  reduction: mean
  teacher_layers: [layer2, layer4]
  student_layers: [embed, blocks.0]
  layer_map:
    layer2: embed
    layer4: blocks.0
  # Recommended first fallback if this mapping is weak:
  # layer_map:
  #   layer1: embed
  #   layer4: blocks.0
  # Reason: embed is only one linear layer away from pixels, similar to
  # layer1 being the teacher's first BasicBlock stage above pixels.
  # early_stop_steps: 300
