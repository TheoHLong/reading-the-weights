experiment_name: cifar10_cka_n4_random_cnn_noise_earlystop300
seed: 42
output_dir: results/metrics
checkpoint_dir: checkpoints

# Purpose: companion to cifar10_cka_n4_earlystop300.yaml.
# Tests early_stop on the OTHER stable regime (random CNN guide + noise input).
# If both stable regimes also collapse after early_stop, "CKA must run full-time
# in this bilinear setting" generalises. If only the random regime collapses,
# trained guide gives the student enough representational basin that CE alone
# can take over after the warmup.

dataset:
  name: cifar10
  root: data/raw
  image_size: 32
  channels: 3
  num_classes: 10

model:
  d_input: 3072
  d_hidden: 512
  n_layer: 4
  d_output: 10
  bias: false
  residual: true
  gate: null

guide:
  architecture: cifar_resnet18

train:
  epochs: 75
  batch_size: 256
  lr: 0.0003
  wd: 0.01
  num_workers: 2
  pin_memory: true
  device: auto
  val_fraction: 0.1

transfer:
  method: cka
  teacher_source: random
  teacher_input: noise
  guide_seed: 42
  alpha: 3.0
  reduction: mean
  early_stop_steps: 300
  teacher_layers: [layer1, layer2, layer3, layer4]
  student_layers: [embed, blocks.0, blocks.1, blocks.2, blocks.3]
  layer_map:
    layer1: embed
    layer2: blocks.0
    layer3: blocks.1
    layer4: blocks.3
