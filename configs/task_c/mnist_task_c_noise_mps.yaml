experiment_name: mnist_task_c_noise_mps
seed: 42
output_dir: results/metrics
checkpoint_dir: checkpoints

dataset:
  name: mnist
  root: data/raw
  image_size: 28
  channels: 1
  num_classes: 10

model:
  d_input: 784
  d_hidden: 256
  n_layer: 1
  d_output: 10
  bias: false
  residual: false

train:
  epochs: 50
  batch_size: 2048
  lr: 0.001
  wd: 1.0
  train_input_noise_std: 0.4
  val_fraction: 0.1
  split_seed: 42
  num_workers: 0
  pin_memory: false
  device: mps
