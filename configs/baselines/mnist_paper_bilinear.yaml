experiment_name: mnist_paper_bilinear
seed: 42
output_dir: results/metrics
checkpoint_dir: checkpoints

dataset:
  name: mnist
  root: data/raw
  image_size: 28
  channels: 1
  num_classes: 10

model:
  d_input: 784
  d_hidden: 256
  n_layer: 1
  d_output: 10
  bias: false
  residual: false
  gate: null

train:
  epochs: 20
  batch_size: 2048
  lr: 0.001
  wd: 0.1
  input_noise_std: 1.0
  num_workers: 2
  pin_memory: true
  device: auto
