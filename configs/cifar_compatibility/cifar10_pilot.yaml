experiment_name: cifar10_pilot
seed: 42
output_dir: results/metrics
checkpoint_dir: checkpoints

dataset:
  name: cifar10
  root: data/raw
  image_size: 32
  channels: 3
  num_classes: 10
  normalize_mean: [0.4914, 0.4822, 0.4465]
  normalize_std: [0.2470, 0.2435, 0.2616]
  train_random_crop: true
  random_crop_padding: 4
  train_random_horizontal_flip: true

model:
  d_input: 3072
  d_hidden: 512
  n_layer: 1
  d_output: 10
  bias: false
  residual: false

train:
  epochs: 3
  batch_size: 256
  lr: 0.0005
  wd: 0.05
  val_fraction: 0.1
  split_seed: 42
  num_workers: 2
  pin_memory: true
  device: auto
